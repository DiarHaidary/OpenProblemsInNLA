version: v0.4
project:
  name: 'IE-05: exact extremizers for partial pivoting on orthogonal matrices'
  description: Complete negative resolution of the original universal orthogonal GEPP QR-extremizer equality,
    by an exact order-eight counterexample and a strict gap to the genuine real supremum.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: Committed and independently reviewed formalization. Exact mathematical sources match the
    accepted proof freeze; authoritative Linux/Comparator evidence is archived under
    verification/linux-2026-09-13/.
sources:
- title: IE-05 — Exact extremizers for partial pivoting on orthogonal matrices
  contributors:
  - name: John Peca-Medlin
    role: Original extremizer conjecture and cited element-growth analysis
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/linear-systems-and-elimination/IE-05/README.md
  type: web-post
  location: Complete retained Context and notation and Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: The full n>=2 equality is negated. The supremum includes all orthogonal real matrices and every
    admissible partial-pivoting tie path; the prescribed positive-diagonal QR candidate uses the first
    available tied row.
- title: 'IE-05: An order-eight counterexample to the orthogonal extremizer conjecture'
  authors:
  - George Stepaniants
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/linear-systems-and-elimination/IE-05/solution.md
  type: manuscript
  location: Theorem and Sections 1–4; complete standalone solution.tex and original integer programs also
    retained
  relationship: formalizes
  author_endorsement: participated
  note: George Stepaniants supplied the original counterexample and requested the substantially ChatGPT/Codex-assisted
    formalization. The witness changes one-based (8,2), zero-based (7,1), from -1 to 0. Only sufficient
    one-sided consequences of the original Gram/LU data are exported; the stronger exact growth equalities
    are not additional formal claims.
- title: Growth factors of orthogonal matrices and local behavior of Gaussian elimination with partial
    and complete pivoting
  authors:
  - John Peca-Medlin
  id: https://arxiv.org/html/2308.16146v2
  type: article
  location: Section 3.2 and Appendix B, as cited in the retained canonical source
  relationship: background
  author_endorsement: not-contacted
  note: Original conjecture and cited element-growth analysis credit. Neither the paper nor an asymptotic-growth
    result is an unproved premise of the Lean proof; the separate asymptotic leading-constant question
    is not settled.
related_formalizations:
- id: https://github.com/sgstepaniants/Forsythe/tree/8d1b0c0545a77b40245e84705aa7d273e6c81e62/lean-proof
  relationship: other
  note: Pinned specification/proof separation and explicit LeanCert kernel-trust inspection examples.
