    tool_setup: AI-assisted proof implementation with independent statement and mathematical source
      reviews; pinned Lean 4.33.1, Mathlib and LeanCert. Exact rational root coordinates, symbolic
      powers of sqrt(3), four weighted complex moments, generic Lagrange interpolation and finite
      nine-label occupancy. Linux development run 34773404263 successfully compiled all ten project
      modules and all fifteen kernel-trust assertions; canonical verification remains pending.
    prompting_notes: Preserve the full IE-16 quantifiers, arbitrary normalized complex polynomials,
      actual norms and Real.pi, attained full/subset minima and a positive maximum over every five-point
      subset. Use Holden’s Section 6 weighted orthogonality and exact uniform product bounds.
