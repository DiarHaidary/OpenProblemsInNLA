fidelity:
  divergences: The public statement uses all Boolean vectors directly rather than masks. The proof introduces a seven-bit mask representation only after defining and proving its Boolean-vector correspondence. The formalization retains the full real square `(1 - boolDot a b)^2`, all `n ≥ 3`, the exact 128-by-127 n = 7 dimensions, integer W/V/denominator certificate obligation, and genuine real minimum semantics. No entry is omitted. The target subtraction is real. The implementation uses guarded or positive-part natural subtraction in its integer helpers; natSquareOneMinus_cast proves that the guarded square agrees with the full real square.
