fidelity:
  divergences: The public statement uses all Boolean vectors directly rather than masks. The proof candidate introduces a seven-bit mask representation only after defining and proving its Boolean-vector correspondence. The formalization retains the full real square `(1 - boolDot a b)^2`, all `n ≥ 3`, the exact 128-by-127 n = 7 dimensions, integer W/V/denominator certificate obligation, and genuine real minimum semantics. No entry is omitted. The target subtraction is real. The implementation uses guarded or positive-part natural subtraction in its integer helpers; natSquareOneMinus_cast proves that the guarded square agrees with the full real square.
review:
  status: statement-approved; proof-candidate-review-pending
  reviewers:
  - statement-referee-1
  - statement-referee-2
  notes: The statement boundary has two independent approvals. The modular proof candidate still requires authoritative Linux LeanCert/default-kernel/Comparator checks and two independent final reviews before Lean-verified status. Its finite family scope is the complete 128-by-128-by-3 row graph described in FULL-ROW-COVERAGE.md; the certificate bridge adds no row restriction or new public hypothesis.
