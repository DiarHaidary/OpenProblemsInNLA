project:
  name: 'IE-16: finite complex-spectrum counterexample to the normal-GMRES subset bound'
  description: Complete negative resolution of the original IE-16 universal inequality from Sidney Holden’s
    exact nine-point, degree-four counterexample. All fifteen independently reviewed contracts passed
    actual non-root Linux Comparator, standard axiom checks and default-kernel replay.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: IE-16 — A sharp subset bound for worst-case normal GMRES
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/b73cd1804e40e0d101294eedb156984f0d62b4a6/linear-systems-and-elimination/IE-16/README.md
  type: web-post
  location: Complete canonical problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: 'All original quantifiers are retained: finite distinct nonzero complex spectra, n >= 3, and
    every 1 <= k <= n - 2.'
- title: 'IE-16: A counterexample and the failure of every universal subset constant'
  authors:
  - Sidney Holden
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/b73cd1804e40e0d101294eedb156984f0d62b4a6/references/holden-ie16-2026-09-12/submitted/source/solution.tex
  type: manuscript
  location: Theorem Explicit counterexample; Section 2 interpolation formulas; Section 3 exact nine-point
    witness and subset estimates; Section 6 Positive weights certify optimality
  relationship: formalizes
  author_endorsement: not-contacted
  note: The finite witness and Section 6 weighted-moment proof are in scope. The implementation supplies
    full and subset IsLeast bridges and a uniform Lagrange/occupancy proof of the all-subset bound.
    The stronger amplification theorem and an operator-level GMRES construction are outside scope.
- title: IE-16 exact finite certificate
  authors:
  - Sidney Holden
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/b73cd1804e40e0d101294eedb156984f0d62b4a6/references/holden-ie16-2026-09-12/submitted/code/verify.py
  type: software
  location: Exact arithmetic certificate and 126 subset checks
  relationship: other
  author_endorsement: not-contacted
  note: Retained exact-arithmetic software and all 126 subset records are supplementary source evidence.
    The Lean candidate uses generic Lagrange interpolation and uniform occupancy/product bounds; the
    JSON and Python results are not imported as trusted premises.
