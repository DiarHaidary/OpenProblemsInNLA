version: v0.4
project:
  name: 'IE-16: finite complex-spectrum counterexample to the normal-GMRES subset bound'
  description: 'Statement-first Lean formalization of Sidney Holden’s exact nine-point,
    degree-four counterexample to the complete IE-16 universal inequality.'
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: 'IE-16 — A sharp subset bound for worst-case normal GMRES'
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/b73cd1804e40e0d101294eedb156984f0d62b4a6/linear-systems-and-elimination/IE-16/README.md
  type: web-post
  location: Complete canonical problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: 'All original quantifiers are retained: finite distinct nonzero complex spectra, n >= 3,
    and every 1 <= k <= n - 2.'
- title: 'IE-16: A counterexample and the failure of every universal subset constant'
  authors:
  - Sidney Holden
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/b73cd1804e40e0d101294eedb156984f0d62b4a6/references/holden-ie16-2026-09-12/submitted/source/solution.tex
  type: manuscript
  location: 'Theorem Explicit counterexample and Sections 2–3'
  relationship: formalizes
  author_endorsement: not-contacted
  note: 'Only the finite nine-point witness is in scope; the stronger amplification theorem is omitted.'
- title: 'IE-16 exact finite certificate'
  authors:
  - Sidney Holden
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/b73cd1804e40e0d101294eedb156984f0d62b4a6/references/holden-ie16-2026-09-12/submitted/code/verify.py
  type: software
  location: Exact arithmetic certificate and 126 subset checks
  relationship: other
  author_endorsement: not-contacted
  note: 'The executable certificate is supplementary evidence and is not imported as an axiom.'
