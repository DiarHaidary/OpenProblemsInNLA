fidelity:
  divergences: All original dimensions, real symmetric matrices, full-column-rank blocks, largest full
    iteration, arbitrary independent Krylov bases and strict interval indices are retained. The stronger
    full-prefix theorem is proved and reduced to the canonical target; no spectral simplicity or basis
    compatibility premise is added. The formalization does not claim a separate finite-precision result.
