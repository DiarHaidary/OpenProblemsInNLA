      Mathlib and LeanCert, exact finite complex algebra, and kernel-only numeric certification.'
    prompting_notes: 'Preserve the full IE-16 target. Use the finite witness, symmetry reduction,
      Lagrange subset bounds and exact rational inequalities; do not replace M_k or subset maxima by lookup tables.'
    notes: 'AI-assisted formalization requested by George Stepaniants. No external human peer review,
      source-author endorsement, priority certification, or measured cost is claimed.'
