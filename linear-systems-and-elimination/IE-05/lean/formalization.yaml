fidelity:
  divergences: All original target quantifiers, real field, orthogonality, positive QR sign convention,
    actual partial-pivoting trajectories, all admissible paths and genuine real supremum are retained.
    Generic supporting QR, scaling and LU results are proved. Auxiliary certificates establish sufficient
    one-sided growth estimates instead of all exact manuscript maxima and growth equalities. The true
    supremum and separate asymptotic leading-constant conjecture are not determined. Historical Challenge
    comments, proof-map phase prose, failed attempts and old wrappers are retained byte-for-byte; the
    live README and correspondence state the completed phase.
