  statement_boundary:
    status: passed locally on macOS using pre-existing pinned dependency objects
    command: SP06_DEP_ROOT=/path/to/existing/.lake/packages python3 verification/statement-typecheck.py
    evidence_prefix: The command creates and prints a fresh temporary directory containing the raw command
      results and elaboration logs.
    note: All ten dependency revisions and clean tracked sources checked; direct Lean elaboration succeeded
      with twenty intentional Challenge warnings. This is not a dependency object rebuild or a mathematical
      proof.
  local_proof:
    status: passed locally on macOS; existing pinned dependency objects reused, not rebuilt
    command: SP06_DEP_ROOT=/path/to/existing/.lake/packages python3 verification/compile_development.py
      Solution
    evidence: verification/local-2026-09-13/CHECKS.json
    notes: Five proof modules elaborate, all twenty exports have only propext, Classical.choice and Quot.sound.
      New objects and logs are created in a fresh temporary prefix. This is not Linux Comparator acceptance.
  linux:
    status: passed on actual non-root Ubuntu Linux
    verified_commit: 3122d69460b0ed6dda3ea00dfaa899f93411ce2f
    run: https://github.com/sgstepaniants/OpenProblemsInNLA/actions/runs/34765629739
    evidence: verification/linux-2026-09-13/README.md
    command: tools/lean/verify.sh eigenvalues-and-inverse-problems/SP-06/lean /tmp/nla-lean-tools
    note: Run from the repository root after bootstrap with the prerequisites in tools/lean/HARNESS.md.
      Fresh project verification uses the trusted pinned Mathlib cache.
  integrity:
