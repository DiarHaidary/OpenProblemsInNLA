  statement_boundary:
    status: passed locally on macOS using pre-existing pinned dependency objects
    command: SP06_DEP_ROOT=/path/to/existing/.lake/packages python3 verification/statement-typecheck.py
    evidence_prefix: The command creates and prints a fresh temporary directory containing
      the raw command results and elaboration logs.
    note: All ten dependency revisions and clean tracked sources checked; direct Lean elaboration
      succeeded with twenty intentional Challenge warnings. This is not a dependency object
      rebuild or a mathematical proof.
  local_proof:
    status: passed locally on macOS; existing pinned dependency objects reused, not rebuilt
    command: SP06_DEP_ROOT=/path/to/existing/.lake/packages python3 verification/compile_development.py
      Solution
    evidence: verification/local-2026-09-13/CHECKS.json
    notes: Five proof modules elaborate, all twenty exports have only propext, Classical.choice
      and Quot.sound. New objects and logs are created in a fresh temporary prefix. This is
      not Linux Comparator acceptance.
