    framework: OpenAI Codex
    tool_setup: Lean 4.33.1 with pinned LeanCert kernel trust assertions. Exact algebra and
      a uniform scalar root-separation bound avoid interval subdivision. Local direct compilation
      reuses pinned dependency objects; authoritative Linux Comparator remains pending.
    prompting_notes: Retain genuine unit-circle continuity and injectivity, arbitrary complex
      Laurent coefficients in the target, the actual complex matrix spectrum, and the full
      negative implication without an assumed existence or continuity bridge.
  notes: AI-assisted proof implementation followed two independent statement approvals. The
    twenty deliberate Challenge placeholders are isolated from Solution. Two independent final
    reviews accepted the complete proof. All twenty actual Solution exports locally elaborate
    with the standard three axioms; no successful Linux or Comparator run is yet claimed.
