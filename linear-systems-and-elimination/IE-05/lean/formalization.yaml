reproduction:
  local_development:
    cwd: linear-systems-and-elimination/IE-05/lean
    command: lake build Solution
    note: Solution is the candidate default target. Historical old lakefile.toml bytes selecting Challenge
      are archived. No new compilation was performed during packaging; unchanged mathematical sources
      have the accepted independent macOS checks.
  package_integrity:
    commands:
    - python3 verification/candidate-package/verify_inventory.py
    - python3 verification/candidate-package/audit_metadata.py
    prerequisites: Python 3.9 or newer; the metadata audit also requires the pinned PyYAML and jsonschema
      requirements in tools/lean/requirements.txt.
    note: Read-only package checks, not mathematical approval or a Lean runtime check.
  authoritative_Linux:
    status: accepted
    cwd: repository root
    host: Non-root Ubuntu with the actual pinned harness prerequisites
    commands:
    - tools/lean/bootstrap.sh /tmp/nla-ie05-check
    - tools/lean/selftest.sh /tmp/nla-ie05-check
    - tools/lean/verify.sh linear-systems-and-elimination/IE-05/lean /tmp/nla-ie05-check
    prerequisites_document: ../../../tools/lean/HARNESS.md
    note: The recorded Ubuntu run is archived in verification/linux-2026-09-13/ and independently audited.
      The initial workflow's unrelated MI-06 and RA-07 elan HTTP 500 failures were retried separately; the
      IE-05 target job itself passed on the original attempt and is the authoritative evidence here.
alignment:
- declaration: NLA.IE05.entryMax_semantics
  scope: The actual finite maximum of absolute real matrix entries is nonnegative, dominates each entry
    and is attained in nonempty dimensions.
- declaration: NLA.IE05.schurStep_bound
  scope: Each actual admissible partial-pivoting Schur step increases the active maximum by at most two.
- declaration: NLA.IE05.gepp_growth_bound
  scope: Every admissible path on a nonempty matrix has a positive input maximum and growth between one
    and 2^(n-1).
- declaration: NLA.IE05.firstPath_semantics
  scope: Nonsingularity gives the actual unique first-available-row path and exact agreement between the
    two trajectory definitions, including ties.
- declaration: NLA.IE05.orthogonalGrowthSet_bounded
  scope: The entire orthogonal growth set over all admissible paths is genuinely nonempty and bounded
    for every n>=2.
- declaration: NLA.IE05.candidate_positiveQR
  scope: The prescribed lower matrix has the actual normalized Euclidean Gram-Schmidt positive-diagonal
    QR factorization, which is unique for every n>=2.
- declaration: NLA.IE05.scaledColumns_orthogonal
  scope: A diagonal real Gram identity with positive column scales yields actual real orthogonality.
- declaration: NLA.IE05.scaledLU_trajectory
  scope: A scaled unit-lower/upper factorization with bounded multipliers and positive diagonals gives
    every actual Schur tail, the first-available no-swap path and terminal zero matrix.
- declaration: NLA.IE05.integer_factor_certificates
  scope: Both literal integer matrices satisfy the complete Gram/LU identities, triangular conditions,
    multiplier bounds and diagonal positivity.
- declaration: NLA.IE05.integer_entry_certificates
  scope: Only 64 witness input and 204 candidate active integer inequalities, a candidate input entry
    and witness final pivot are required.
- declaration: NLA.IE05.canonical_integer_identification
  scope: Positive QR uniqueness identifies the integer normalized candidate with the independently defined
    Euclidean Gram-Schmidt candidate and its actual scan path.
- declaration: NLA.IE05.witness_orthogonal_path
  scope: The real witness is orthogonal and its no-swap path is the actual first-available admissible
    path.
- declaration: NLA.IE05.bounded_growth_data
  scope: Five one-sided input/growth estimates hold in the implemented finite maximum and trajectory semantics.
- declaration: NLA.IE05.numerical_gap_positive
  scope: The exact rational squared gap is 117335164/1147041 and is strictly positive.
- declaration: NLA.IE05.witness_strict_growth
  scope: The actual first-available GEPP growth of the dimension-eight witness strictly exceeds the candidate
    growth.
- declaration: NLA.IE05.supremum_strict_gap
  scope: Actual witness membership in the nonempty bounded orthogonal growth set gives a strict gap to
    its real supremum.
- declaration: NLA.IE05.orthogonalExtremizerConjecture
  scope: The full original all-dimensional orthogonal GEPP extremizer equality is false, by dimension
    eight.
