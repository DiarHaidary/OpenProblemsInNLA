fidelity:
  divergences: 'The full canonical target and all original assumptions, quantifiers, complex field and bilinear
    full-entry metric are retained. The informal Jacobian smoothness explanation is implemented through genuine
    localized algebraic smoothness, retractions and a square-zero lifting obstruction. The whole-ideal tangent
    and arbitrary generic-open intersection are proved. Supporting derivative/Hessian statements are generalized
    where stated. Only the full original conjunction is refuted; the remaining individual formulas and corrected
    values are not settled. The source abcLocalChart comment uses complete local ring for the ordinary localization:
    no adic completion or completeness theorem is claimed. Hessian nondegeneracy is exported, but no separate
    scheme-theoretic multiplicity theorem is formalized.'
