fidelity:
  divergences: The boundary retains every n >= 3, every n-point nonzero complex spectrum and every 1
    <= k <= n-2. The finite counterexample fixes epsilon=1/1000, n=9 and k=4. Holden’s Section 6 positive
    weighted orthogonality supplies the full minimum and attainment. Generic complex Lagrange interpolation,
    injective nine-point labels, complete cluster occupancy and uniform product estimates 109 and 146
    give the all-subset bound. The 126-row certificate is supplementary; it is not imported as a theorem
    or used to define M or subsetMax. The stronger amplification/unbounded-ratio theorem, asymptotic
    limit, operator-level GMRES construction, exact subsetMax value and minimality of dimension are
    outside scope.
proof_route:
- files:
  - NLA/IE16/Numeric.lean
  role: Exact nine-point injectivity and nonzero geometry, witness feasibility and equal residual norms,
    nine positive rational weights summing to one and four vanishing complex moments. The current optimization
    factors sqrt(3) out of root coordinates before finite comparisons and reduces its powers through
    degree seven symbolically.
- files:
  - NLA/IE16/WeightedDraft.lean
  - NLA/IE16/WeightedBridgeDraft.lean
  - NLA/IE16/FullMinimumDraft.lean
  role: Generic weighted norm-square identities and the indexed moment bridge bound every normalized
    complex polynomial of degree at most four. The witness attains that bound, giving IsLeast and M=3003003000/1001003001001
    > 299/100000. The public full-minimum route uses the indexed bridge.
- files:
  - NLA/IE16/Minimax.lean
  - NLA/IE16/SubsetBoundsDraft.lean
  - NLA/IE16/SubsetGeometryDraft.lean
  role: Mathlib Lagrange interpolation constructs an attainer on arbitrary five nonzero complex nodes
    and proves its global lower bound. Injective labels preserve every actual subset. Point modulus
    >=999/1000, close distance <=13/7500 and any distance <=2603/1500 give strictly positive product
    denominators and coefficient bounds 109 or 146. Occupancy yields at least four contributions above
    109 or three above 146. Thus the Lagrange sum exceeds 436 or 438, and every one of the 126 subset
    minima is below 23/10000.
- files:
  - NLA/IE16/FinalContractsDraft.lean
  - Solution.lean
  role: A nonempty subset family, attained positive subset minima and a positive actual subset maximum
    support the strict ratio >13/10>4/Real.pi. The n=9, k=4 certificate negates the complete original
    universal assertion; Solution exposes all fifteen approved names.
