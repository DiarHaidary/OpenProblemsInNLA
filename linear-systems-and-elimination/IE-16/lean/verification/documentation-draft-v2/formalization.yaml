    framework: OpenAI Codex
    tool_setup: Separate documentation-only packaging by /root/nr03_independent_referee (AI agent),
      after its independent mathematical source review. Read-only Git/source and raw Linux development
      evidence inspection, with the existing metadata schema environment. No local compiler, Lean/Lake
      invocation, proof-source edit or dependency download by the packaging agent.
    prompting_notes: Preserve exact source and review provenance, source credit and formalization
      affiliation. Report successful development compilation and measured axiom sets separately
