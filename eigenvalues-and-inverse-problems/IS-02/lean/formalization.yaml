reproduction:
  proof_stage:
    status: passed locally on macOS with pre-existing dependency artifacts
    command: IS02_DEP_ROOT=/path/to/existing/.lake/packages verification/proof-typecheck.sh
    note: Definitions, Proof and Solution are directly elaborated from a fresh private output prefix after
      all ten manifest revisions and clean tracked dependency trees are checked; raw commands and results
      are retained in that prefix. LeanCert kernel trust and all nine public axiom reports pass. This
      is not the authoritative Linux Comparator result.
  statement_boundary:
    status: passed locally on macOS with pre-existing dependency artifacts
    command: IS02_DEP_ROOT=/path/to/existing/.lake/packages verification/statement-typecheck.sh
    note: The command invokes the pinned Lean binary directly, writes only to a fresh private output prefix,
      and never runs Lake, downloads dependencies, or rebuilds caches.
  integrity:
    command: python3 verification/verify_publication.py
    note: Run from the problem lean directory in a full repository checkout with the shared metadata requirements
      installed. Checks current package and original verified-input correspondence offline; no new Lean
      run is implied.
  linux:
    status: passed on actual non-root Ubuntu Linux
    verified_commit: 522f091b9f0d39d4846f5939bcafc1549ba16a55
    run: https://github.com/sgstepaniants/OpenProblemsInNLA/actions/runs/34766178560
    evidence: verification/linux-2026-09-13/README.md
    command: tools/lean/verify.sh eigenvalues-and-inverse-problems/IS-02/lean /tmp/nla-lean-tools
