alignment:
- declaration: NLA.RA20.hollow_variety_semantics
  scope: The actual complex hollow determinant is 2abc; membership in the original rank-at-most-two, three-diagonal-zero
    variety is equivalent to abc=0, and every original matrix has that hollow form.
- declaration: NLA.RA20.reduced_coordinate_ring
  scope: An actual coordinate-preserving algebra equivalence takes the quotient by all polynomials vanishing
    on the original matrix variety to C[a,b,c]/(abc), with all nine matrix-coordinate images proved.
- declaration: NLA.RA20.algebraic_smooth_locus
  scope: Actual point-prime membership in the algebraic smooth locus of the reduced matrix ring is equivalent
    to hollow form and exactly one zero off-diagonal coordinate; origin and axis intersections are excluded
    even if matrix rank is two.
- declaration: NLA.RA20.algebraic_tangent_space
  scope: At every abc=0 point, including singular points, annihilation of derivatives of the entire original
    vanishing ideal is equivalent to symmetry, zero diagonal, and bc Z01 + ac Z02 + ab Z12 = 0, with no rank
    restriction on directions.
- declaration: NLA.RA20.full_frobenius_differential
  scope: For every natural matrix order and every complex U,X,Z, the actual complex Frechet derivative of the
    full-entry squared distance equals 2 sum_ij (Xij-Uij) Zij; differentiability is proved.
- declaration: NLA.RA20.hollow_distance_semantics
  scope: For arbitrary complex symmetric data, the full Frobenius bilinear objective restricts to the diagonal
    constant plus twice the three off-diagonal squared differences, without conjugation.
- declaration: NLA.RA20.generic_critical_locus
  scope: For every symmetric complex datum with nonzero off-diagonal product, the entire genuine smooth critical
    set equals the injective range of its three component projections.
- declaration: NLA.RA20.component_hessians
  scope: For every complex datum, even nonsymmetric, all three component charts have actual second complex
    Frechet derivative 4 sum_j h_j v_j and zero radical. No separate scheme-theoretic multiplicity result is
    exported.
- declaration: NLA.RA20.generic_data_intersection
  scope: Every arbitrary ambient polynomial nonzero somewhere on symmetric complex data remains nonzero at
    some datum in the displayed generic set; the full six-dimensional symmetric data space and arbitrary diagonals
    are retained.
- declaration: NLA.RA20.generic_count_three
  scope: Actual smooth critical-subtype cardinality is three on a nonempty principal Zariski-open subset of
    symmetric complex data.
- declaration: NLA.RA20.generic_count_not_four
  scope: No nonempty principal Zariski-open subset of symmetric complex data can support a competing actual
    generic count four.
- declaration: NLA.RA20.not_criticalCountConjecture
  scope: Unconditional negation of the complete original joint four-formula generic critical-count conjecture
    for all n>=3 and 1<=s<=min(4,n), by its allowed n=s=3 case. The other formulas are not separately settled.
